name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Verify Native & WebAssembly Targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Verify formatting (gofmt -s)
        run: |
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Unformatted Go files detected:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run static analysis (go vet)
        run: go vet ./...

      - name: Run unit & example tests
        run: go test -v -race -count=1 ./...

      - name: Verify js/wasm cross-compilation
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./examples/wasm

      - name: Set up TinyGo
        uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: '0.41.1'

      - name: Verify TinyGo micro-WASM compilation (<50 KB)
        run: |
          tinygo build -opt=z -no-debug -panic=trap -target wasm -o /tmp/example.wasm ./examples/wasm
          WASM_BYTES=$(wc -c < /tmp/example.wasm)
          echo "Compiled TinyGo example.wasm size: ${WASM_BYTES} bytes"
          if [ "$WASM_BYTES" -le 0 ] || [ "$WASM_BYTES" -gt 51200 ]; then
            echo "::error::TinyGo example.wasm size (${WASM_BYTES} bytes) exceeds 50 KB (51200 bytes) micro-WASM budget!"
            exit 1
          fi
          rm -f /tmp/example.wasm
