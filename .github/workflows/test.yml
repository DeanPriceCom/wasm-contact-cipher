name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Verify Native & WebAssembly Targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Verify formatting (gofmt -s)
        run: |
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Unformatted Go files detected:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run static analysis (go vet)
        run: go vet ./...

      - name: Run unit & example tests
        run: go test -v -race -count=1 ./...

      - name: Verify js/wasm cross-compilation
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./examples/wasm
